<script>
// Función tradicional
function sumar(a, b) {
return a + b;
}

// Convertida a función flecha
const sumarFlecha = (a, b) => {
 return a + b;
};

// Función tradicional
function restar(a, b) {
     return a - b;
}

// Convertida a función flecha
const restarFlecha = (a, b) => {
return a - b;
};

// Función tradicional
function saludar(nombre) {
return "Hola " + nombre;
}

// Convertida a función flecha
const saludarFlecha = (nombre) => {
return "Hola " + nombre;
};

// Ejecutar las funciones
console.log(sumarFlecha(10, 5));
console.log(restarFlecha(10, 5));
console.log(saludarFlecha("Karen Sofia "));
</script>
