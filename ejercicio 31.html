<script>
    // Crear objeto producto
const producto = {
    nombre: "Laptop",
    precio: 1200,
    stock: 5
};

// Obtener claves y valores
let claves = Object.keys(producto);
let valores = Object.values(producto);

// Recorrer e imprimir contenido
for (let i = 0; i < claves.length; i++) {
    console.log(claves[i] + ": " + valores[i]);
}
</script>
